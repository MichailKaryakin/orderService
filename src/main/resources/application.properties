spring.application.name=order
spring.config.import=optional:application-secret.properties

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# Kafka
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.group-id=order
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.listener.missing-topics-fatal=false

# Monitoring & Actuator
management.endpoints.web.exposure.include=prometheus,health,metrics,info
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Feign + Circuit Breaker
spring.cloud.openfeign.circuitbreaker.enabled=true

# Resilience4j
resilience4j.circuitbreaker.instances.catalog-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.catalog-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.catalog-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.catalog-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.catalog-service.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.catalog-service.slow-call-rate-threshold=80
resilience4j.timelimiter.instances.catalog-service.timeout-duration=3s
resilience4j.retry.instances.catalog-service.max-attempts=3
resilience4j.retry.instances.catalog-service.wait-duration=500ms
resilience4j.retry.instances.catalog-service.retry-exceptions[0]=feign.RetryableException
resilience4j.retry.instances.catalog-service.retry-exceptions[1]=java.io.IOException

server.port=8082